<!-- Always name the homepage of the website index.html -->
<!-- DOCTYPE defines the document as an HTML5 document -->
<!DOCTYPE html>
<html>
<head>
	<!-- Code inside the head tag is extra information about the website (metadata, title etc.) -->
	<!-- It doesn't get rendered -->
	<title>Hello First Website!</title>
</head>
<body>
<!-- Code inside the body tag gets rendered to the browser -->

<p>Hello World!</p>
<p>My first Web Page!</p>

</body>
</html>
